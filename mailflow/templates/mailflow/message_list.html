{% extends "mailflow/base.html" %}

{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

            {% for message in object_list %}

            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">Тема: {{ message.subject }}</p>
                        <p class="card-text">Тело письма: {{ message.body | truncatechars:30 }}</p>
                        <p class="card-text">Дата создания: {{ message.created_at }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailflow:message_detail' message.pk %}" role="button">
                                    Посмотреть
                                </a>
                                <a class="btn btn-secondary" href="{% url 'mailflow:message_update' message.pk %}" role="button">
                                    Редактировать
                                </a>
                                <a class="btn btn-danger" href="{% url 'mailflow:message_delete' message.pk %}" role="button">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {% endfor %}

        </div>

    </div>
</div>

{% endblock %}
