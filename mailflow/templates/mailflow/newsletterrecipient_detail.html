{% extends "mailflow/base.html" %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="col">
            <div class="card shadow-sm">
                <div class="card-body">
                    <p class="card-text">ФИО: {{ object.full_name }}</p>
                    <p class="card-text">Email: {{ object.email }}</p>
                    <p class="card-text">Комментарий: {{ object.comment }}</p>
                    <p class="card-text">Дата создания: {{ object.created_at }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-primary" href="{% url 'mailflow:recipients_list' %}" role="button">
                                Назад
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
