{% extends "mailflow/base.html" %}

{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

            {% for recipient in object_list %}

            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">ФИО: {{ recipient.full_name }}</p>
                        <p class="card-text">Email: {{ recipient.email }}</p>

                        {% if user.is_manager %}
                        <p class="card-text">Создал: {{ recipient.creator}}</p>
                        {% endif %}

                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'mailflow:recipients_detail' recipient.pk %}" role="button">
                                    Посмотреть
                                </a>
                                <a class="btn btn-secondary" href="{% url 'mailflow:recipients_update' recipient.pk %}" role="button">
                                    Редактировать
                                </a>
                                <a class="btn btn-danger" href="{% url 'mailflow:recipients_delete' recipient.pk %}" role="button">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {% endfor %}

        </div>

    </div>
</div>

{% endblock %}
