{% extends "mailflow/base.html" %}
{% block content %}


<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">

        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary mx-3 my-3">
                    Войти
                </button>
                <a class="mx-auto my-2" href="{% url 'users:password_reset' %}">
                    Забыли пароль?
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
