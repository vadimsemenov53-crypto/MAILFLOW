{% extends "mailflow/base.html" %}

{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

            {% for user in object_list %}

            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        {% if user.avatar %}
                        <img src="{{ user.avatar.url }}" class="img-fluid">
                        {% endif %}
                        <p class="card-text">Email: {{ user.email }}</p>
                        <p class="card-text">Телефон: {{ user.phone }}</p>
                        <p class="card-text">Страна: {{ user.country }}</p>
                        <p class="card-text">Активный: {{ user.is_active }}</p>

                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-danger" href="#"
                                   role="button">Заблокировать</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {% endfor %}

        </div>

    </div>
</div>

{% endblock %}
